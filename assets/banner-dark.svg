<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="David Yehuda Surbakti - Full-Stack Developer">
  <title>David Yehuda Surbakti — Full-Stack Developer</title>
  <defs>
    <filter id="blurdark" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <linearGradient id="edgedark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4D9BFF"/>
      <stop offset="55%" stop-color="#34E2C5"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="900" height="300" fill="#070C16"/>
  <rect width="900" height="300" fill="#FFFFFF" opacity="0"/>
  
  <g filter="url(#blurdark)" opacity="0.62">
    <ellipse cx="144" cy="66" rx="150" ry="96" fill="#4D9BFF" opacity="0.55">
      <animate attributeName="cx" values="144;216;117;144" dur="19s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="66;102;48;66" dur="23s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="738" cy="210" rx="168" ry="98" fill="#34E2C5" opacity="0.34">
      <animate attributeName="cx" values="738;666;774;738" dur="25s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="210;174;228;210" dur="21s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="504" cy="276" rx="120" ry="72" fill="#A78BFA" opacity="0.28">
      <animate attributeName="opacity" values="0.18;0.34;0.18" dur="13s" repeatCount="indefinite"/>
    </ellipse>
  </g>
  <rect width="900" height="300" fill="url(#edgedark)" opacity="0.05"/>

  <!-- status pill -->
  <g transform="translate(56,54)">
    <rect x="0" y="0" width="176" height="30" rx="15" fill="#0E1729" fill-opacity="0.8" stroke="#1E2E4A"/>
    <circle cx="18" cy="15" r="4" fill="#34E2C5">
      <animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="32" y="19.5" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.4" fill="#8FA3BF">OPEN TO COLLABORATE</text>
  </g>

  <!-- name -->
  <text x="56" y="164" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="46" font-weight="800" letter-spacing="-1.2" fill="#F2F7FF">David Yehuda Surbakti</text>
  <!-- underline draws itself, once -->
  <path d="M58 182 H470" stroke="url(#edgedark)" stroke-width="4" stroke-linecap="round" fill="none" stroke-dasharray="412" stroke-dashoffset="412">
    <animate attributeName="stroke-dashoffset" values="412;0" dur="1.1s" begin="0.25s" fill="freeze"/>
  </path>
  <text x="56" y="212" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="14.5" font-weight="600" fill="#4D9BFF">Full-Stack Developer  ·  UI/UX Designer</text>
  <text x="56" y="234" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="13" fill="#8FA3BF">AI-Assisted Builder  ·  SMK RPL · Grade XI</text>
  <text x="56" y="266" font-family="Inter, 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', sans-serif" font-size="12.5" fill="#5B6F8E">Semarang, Indonesia  ·  building clean interfaces &amp; the logic behind them</text>

  <g transform="translate(700 66) scale(0.62)">
  <g>
    <animateTransform attributeName="transform" values="0 24 24;360 24 24" dur="7s" additive="sum" repeatCount="indefinite"/>
    <ellipse cx="24" cy="24" rx="20" ry="7.6" fill="none" stroke="#61DAFB" stroke-width="2.6"/>
    <ellipse cx="24" cy="24" rx="20" ry="7.6" fill="none" stroke="#61DAFB" stroke-width="2.6" transform="rotate(60 24 24)"/>
    <ellipse cx="24" cy="24" rx="20" ry="7.6" fill="none" stroke="#61DAFB" stroke-width="2.6" transform="rotate(120 24 24)"/>
    <circle cx="24" cy="24" r="3.4" fill="#61DAFB">
      <animate attributeName="r" values="3.4;4.4;3.4" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g></g><g transform="translate(756 66) scale(0.62)">
  <g>
    <circle cx="24" cy="24" r="10" fill="none" stroke="#34E2C5" stroke-width="1.6" opacity="0">
      <animate attributeName="r" values="14;26" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.5;0" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <path d="M9 13 V35 C9 39 39 39 39 35 V13" fill="#0A5B6B" opacity="0.9"/>
    <ellipse cx="24" cy="13" rx="15" ry="5.6" fill="#007589"/>
    <ellipse cx="24" cy="13" rx="15" ry="5.6" fill="none" stroke="#F29111" stroke-width="1.4" opacity="0.8"/>
    <path d="M9 24 C9 28 39 28 39 24" fill="none" stroke="#F29111" stroke-width="1.8" opacity="0.95">
      <animate attributeName="d" values="M9 20 C9 24 39 24 39 20;M9 30 C9 34 39 34 39 30;M9 20 C9 24 39 24 39 20" dur="3.4s" repeatCount="indefinite"/>
    </path>
    <path d="M9 27 C9 31 39 31 39 27" fill="none" stroke="#8FE3D8" stroke-width="1.4" opacity="0.6">
      <animate attributeName="d" values="M9 23 C9 27 39 27 39 23;M9 33 C9 37 39 37 39 33;M9 23 C9 27 39 27 39 23" dur="3.4s" repeatCount="indefinite"/>
    </path>
  </g></g><g transform="translate(812 66) scale(0.62)"><rect x="8" y="8" width="5" height="32" rx="2.5" fill="#FF2D20"/><rect x="15" y="8" width="14" height="5" rx="2.5" fill="#FF2D20"><animate attributeName="width" values="0;14;14;0" keyTimes="0;0.28;0.78;1" dur="3.4s" begin="0.00s" repeatCount="indefinite"/></rect><rect x="15" y="19" width="21" height="5" rx="2.5" fill="#FF2D20"><animate attributeName="width" values="0;21;21;0" keyTimes="0;0.28;0.78;1" dur="3.4s" begin="0.28s" repeatCount="indefinite"/></rect><rect x="15" y="30" width="28" height="5" rx="2.5" fill="#FF2D20"><animate attributeName="width" values="0;28;28;0" keyTimes="0;0.28;0.78;1" dur="3.4s" begin="0.56s" repeatCount="indefinite"/></rect></g>

  <!-- soft specular sweep across the whole card -->
  <g clip-path="url(#clipdark)">
    <rect x="-320" y="-40" width="200" height="380" fill="#FFFFFF" opacity="0.09" transform="skewX(-14)">
      <animate attributeName="x" values="-340;1080" dur="7s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="0.6" y="0.6" width="898.8" height="298.8" rx="22" fill="none" stroke="#1E2E4A" stroke-width="1.2"/>
  <defs>
    <clipPath id="clipdark"><rect x="1" y="1" width="898" height="298" rx="22"/></clipPath>
  </defs>
</svg>
