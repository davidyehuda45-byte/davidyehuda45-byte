<svg width="900" height="420" viewBox="0 0 900 420" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#05080f"/>
    <stop offset="50%" stop-color="#0b1220"/>
    <stop offset="100%" stop-color="#05080f"/>
  </linearGradient>

  <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#58A6FF"/>
    <stop offset="100%" stop-color="#00D9FF"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>

  <pattern id="grid" width="35" height="35" patternUnits="userSpaceOnUse">
    <path d="M 35 0 L 0 0 0 35"
          fill="none"
          stroke="#58A6FF"
          stroke-opacity=".07"
          stroke-width="1"/>
  </pattern>

  <style>

    .float1 {
      animation: float1 3s ease-in-out infinite;
      transform-origin: center;
    }

    .float2 {
      animation: float2 3.7s ease-in-out infinite;
      transform-origin: center;
    }

    .float3 {
      animation: float3 4.2s ease-in-out infinite;
      transform-origin: center;
    }

    .pulse {
      animation: pulse 2s ease-in-out infinite;
      transform-origin: center;
    }

    .spin {
      animation: spin 8s linear infinite;
      transform-origin: center;
    }

    .spinReverse {
      animation: spinReverse 10s linear infinite;
      transform-origin: center;
    }

    .blink {
      animation: blink 1.8s ease-in-out infinite;
    }

    .wave {
      animation: wave 2.5s ease-in-out infinite;
    }

    @keyframes float1 {
      0%,100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @keyframes float2 {
      0%,100% {
        transform: translateY(0px) rotate(0deg);
      }
      50% {
        transform: translateY(8px) rotate(3deg);
      }
    }

    @keyframes float3 {
      0%,100% {
        transform: translateY(0px) scale(1);
      }
      50% {
        transform: translateY(-7px) scale(1.04);
      }
    }

    @keyframes pulse {
      0%,100% {
        transform: scale(1);
        opacity: .85;
      }
      50% {
        transform: scale(1.12);
        opacity: 1;
      }
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes spinReverse {
      from {
        transform: rotate(360deg);
      }
      to {
        transform: rotate(0deg);
      }
    }

    @keyframes blink {
      0%,100% {
        opacity: .25;
      }
      50% {
        opacity: 1;
      }
    }

    @keyframes wave {
      0%,100% {
        transform: translateX(0px);
      }
      50% {
        transform: translateX(8px);
      }
    }

  </style>

</defs>

<!-- BACKGROUND -->

<rect width="900" height="420" rx="28" fill="url(#bg)"/>

<rect width="900" height="420" rx="28" fill="url(#grid)"/>

