name: Generate Pacman Contribution Game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Pacman Contribution Assets
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution-grid.svg?palette=pacman
            dist/pacman-contribution-grid-dark.svg?palette=pacman&color_snake=orange&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
            dist/pacman-contribution-grid.gif?palette=pacman
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify Generated Assets
        run: |
          ls -la dist/

      - name: Deploy to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          committer: GitHub Actions <actions@github.com>
          author: GitHub Actions <actions@github.com>
          commit_message: "build: auto update pacman contribution grid [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
