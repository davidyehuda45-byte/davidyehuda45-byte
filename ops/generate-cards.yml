name: Generate profile cards

# >>> TO ACTIVATE: move this file to .github/workflows/generate-cards.yml (it is parked in ops/
# >>> because the automation account used for this branch cannot push into .github/workflows).
# >>> Also set Settings -> Actions -> General -> Workflow permissions = "Read and write permissions".

# Rebuilds generated/*.svg (stats · top languages · contribution calendar) straight from the
# GitHub GraphQL API, so the profile README never shows stale numbers and never depends on a
# third-party card service being online. Renders both palettes (…​.svg = dark, …​-light.svg = light).

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC ≈ 13:17 WIB, daily
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/render_cards.py"
      - ".github/workflows/generate-cards.yml"

permissions:
  contents: write

concurrency:
  group: profile-cards
  cancel-in-progress: true

jobs:
  render:
    name: Render SVG cards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate cards (dark + light)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: davidyehuda45-byte
        run: python scripts/render_cards.py

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated
          if git diff --cached --quiet; then
            echo "Cards unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "chore(profile): refresh generated cards [skip ci]"
          git push
